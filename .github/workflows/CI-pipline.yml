name: CI Pipeline for Learning

on:
  push:
    branches: [DevBranch]
  pull_request:
    branches: [DevBranch]

jobs:
  build_test:
  run-on: ubuntu-latest
  steps:
    # checkout code from the DevBranch
      - name: checkout code
        uses: actions/checkout@v5.0.0

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: install dependencies
        run: npm install

      - name: run tests
        run: |
          mkdir -p test-results
          npm test -- --reporter mocha-junit-reporter --reporter-options mochaFile=./test-results/results.xml
    
    
